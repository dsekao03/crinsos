<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>배출 시간 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 시안 그대로. 위는 설정을 모은 짙은 조작판(배출/주기/라인 | 공유/초기화), 아래는 밝은 10줄 시간표.
   색 역할 유지: 초록=번호, 노랑=시간, 회색=시작, 빨강=결과, 주황=주기, 보라=라인, 파랑=버튼 */
:root{
  color-scheme: light;
  --page:#e4e8f0; --sheet:#ffffff; --ink:#1d2639; --muted:#5a657a; --hair:#e6e9f1; --soft:#eef1f7;
  --panel:#222c42; --panel-ink:#f2f5fb; --panel-muted:#aab6cf; --tool:#303d5a; --tool-hover:#3a496b; --tool-line:#43537a;
  --blue:#3f74e0; --blue-hover:#3366cc; --ring:rgba(63,116,224,.45);
  --green-bg:#ddf3e6; --green-ink:#0b5c35; --green-line:#a6d9bc;
  --yellow-bg:#fff2b8; --yellow-ink:#2f2700; --yellow-line:#ecd35c; --yellow-strong:#9a7d00;
  --gray-bg:#606b80; --gray-ink:#ffffff; --gray-line:#505a6e;
  --red-bg:#d4372f; --red-ink:#ffffff; --red-line:#b8261f;
  --orange-bg:#ffb224; --orange-ink:#2b1a00;
  --purple-bg:#7b4fca; --purple-ink:#ffffff;
  --focus-fill:rgba(255,255,255,.92); --focus-fill-dim:rgba(255,255,255,.22);
  --toast-bg:#1d2639; --toast-ink:#ffffff;
  --ok:#1f9d60; --todo:#e8940c;
  --shadow:0 1px 2px rgba(29,38,57,.08), 0 18px 44px -18px rgba(29,38,57,.28);
  --font:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --num:"Barlow Semi Condensed", "Roboto Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --cell-h:clamp(42px, 5.2vh, 50px);
  --radius:11px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0b0f18; --sheet:#131a28; --ink:#e8edf7; --muted:#97a4bd; --hair:#232d42; --soft:#1e2739;
    --panel:#1c2538; --panel-ink:#f2f5fb; --panel-muted:#9eabc6; --tool:#29344d; --tool-hover:#33415f; --tool-line:#3b496a;
    --blue:#4a7ee8; --blue-hover:#5b8cf0; --ring:rgba(110,155,255,.55);
    --green-bg:#133a2a; --green-ink:#93e5b7; --green-line:#235c42;
    --yellow-bg:#393212; --yellow-ink:#ffe784; --yellow-line:#645719; --yellow-strong:#d9bd3a;
    --gray-bg:#475167; --gray-ink:#ffffff; --gray-line:#58637a;
    --red-bg:#c93a33; --red-ink:#ffffff; --red-line:#dc5048;
    --orange-bg:#f2a61b; --orange-ink:#251600;
    --purple-bg:#7650c2; --purple-ink:#ffffff;
    --focus-fill:rgba(255,255,255,.14); --focus-fill-dim:rgba(255,255,255,.2);
    --toast-bg:#e8edf7; --toast-ink:#151d2d;
    --ok:#46c486; --todo:#f5ac35;
    --shadow:0 0 0 1px #232d42, 0 18px 44px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0b0f18; --sheet:#131a28; --ink:#e8edf7; --muted:#97a4bd; --hair:#232d42; --soft:#1e2739;
  --panel:#1c2538; --panel-ink:#f2f5fb; --panel-muted:#9eabc6; --tool:#29344d; --tool-hover:#33415f; --tool-line:#3b496a;
  --blue:#4a7ee8; --blue-hover:#5b8cf0; --ring:rgba(110,155,255,.55);
  --green-bg:#133a2a; --green-ink:#93e5b7; --green-line:#235c42;
  --yellow-bg:#393212; --yellow-ink:#ffe784; --yellow-line:#645719; --yellow-strong:#d9bd3a;
  --gray-bg:#475167; --gray-ink:#ffffff; --gray-line:#58637a;
  --red-bg:#c93a33; --red-ink:#ffffff; --red-line:#dc5048;
  --orange-bg:#f2a61b; --orange-ink:#251600;
  --purple-bg:#7650c2; --purple-ink:#ffffff;
  --focus-fill:rgba(255,255,255,.14); --focus-fill-dim:rgba(255,255,255,.2);
  --toast-bg:#e8edf7; --toast-ink:#151d2d;
  --ok:#46c486; --todo:#f5ac35;
  --shadow:0 0 0 1px #232d42, 0 18px 44px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink); font-family:var(--font);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;
  -webkit-text-size-adjust:100%;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sheet{max-width:600px;margin:0 auto;background:var(--sheet);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}

button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s, transform .08s, filter .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* ---------- 상단 조작판 ---------- */
.panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;padding:18px 22px;background:var(--panel);color:var(--panel-ink)}
.settings{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:10px 12px;align-items:center}
.label{font-size:17px;font-weight:600;white-space:nowrap;color:var(--panel-muted)}
.label.second{padding-left:4px}
.head{grid-column:2 / 4}
.actions{display:flex;gap:10px;padding-left:22px;border-left:1px solid var(--tool-line)}

.btn{min-height:var(--cell-h);padding:0 16px;border:0;border-radius:var(--radius);background:var(--blue);color:#fff;font-size:16px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--blue-hover)}
.btn.plain{background:var(--soft);color:var(--ink)}
.btn.plain:hover{filter:brightness(.96)}
.btn.danger{background:var(--red-bg);color:var(--red-ink)}
.btn.danger:hover{filter:brightness(1.08)}
.apply.pending{box-shadow:0 0 0 3px var(--orange-bg);animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,178,36,.25)}}

.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:76px;border:1px solid var(--tool-line);border-radius:14px;background:var(--tool);color:var(--panel-ink);font-size:14px;font-weight:600}
.tool:hover{background:var(--tool-hover)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.pick{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0;height:var(--cell-h);padding:0 8px;border:0;border-radius:var(--radius);font-size:18px;font-weight:700;white-space:nowrap}
.pick::after{content:"";width:7px;height:7px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.75}
.pick:hover{filter:brightness(1.07)}
.pick.cycle{background:var(--orange-bg);color:var(--orange-ink);font-family:var(--num), var(--font);font-size:23px}
.pick.cycle.empty{font-family:var(--font);font-size:17px}
.pick.lineSel{background:var(--purple-bg);color:var(--purple-ink)}

.status{display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;margin:0;padding:10px 16px;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.45;color:var(--muted);text-align:center;word-break:keep-all}
.status::before{content:"";width:8px;height:8px;flex:none;border-radius:50%;background:var(--todo)}
.status[data-tone="ok"]::before{background:var(--ok)}
.status[data-tone="edit"]::before{background:var(--blue)}

/* ---------- 시간표 ---------- */
.rows{list-style:none;margin:0;padding:14px clamp(12px,4vw,26px) 20px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,2fr);column-gap:clamp(8px,3vw,20px);align-items:center}
.row:first-child{padding-bottom:13px;margin-bottom:4px;border-bottom:1px solid var(--hair)}   /* 첫 줄만 계산 방식이 다름 */

/* 시:분 한 칸 */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr);align-items:center;min-width:0;height:var(--cell-h);padding:3px;border:1px solid transparent;border-radius:var(--radius);transition:border-color .15s, box-shadow .15s}
.t-yellow{background:var(--yellow-bg);color:var(--yellow-ink);border-color:var(--yellow-line)}
.t-gray{background:var(--gray-bg);color:var(--gray-ink);border-color:var(--gray-line)}
.t-red{background:var(--red-bg);color:var(--red-ink);border-color:var(--red-line)}
.colon{display:flex;flex-direction:column;align-items:center;gap:7px}
.colon::before,.colon::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}

.cell{display:block;width:100%;min-width:0;height:100%;margin:0;padding:0;border:0;border-radius:8px;background:transparent;color:inherit;font-family:var(--num);font-size:25px;font-weight:600;line-height:1;text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.cell::placeholder{color:currentColor;opacity:.4}
.cell:placeholder-shown:not(:focus):not([placeholder="––"]){font-family:var(--font);font-size:16px;font-weight:500}
output.cell{display:flex;align-items:center;justify-content:center;user-select:text}
output.cell:empty::before{content:"––";opacity:.55}
input.cell:focus{outline:0;background:var(--focus-fill)}
.t-gray input.cell:focus{background:var(--focus-fill-dim)}
.cell::selection{background:var(--blue);color:#fff}
.pair:focus-within,.num:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.num{width:100%;min-width:0;height:var(--cell-h);margin:0;padding:0 3px;border:1px solid var(--green-line);border-radius:var(--radius);background:var(--green-bg);color:var(--green-ink);font-family:var(--num), var(--font);font-size:23px;font-weight:700;text-align:center;-webkit-appearance:none;appearance:none;transition:border-color .15s, box-shadow .15s}
.num:focus{outline:0}
.num.text{font-family:var(--font);font-size:16px;letter-spacing:-.03em;padding:0 1px}
.num::placeholder{color:currentColor;opacity:.55}
.num:placeholder-shown:not(:focus){font-family:var(--font);font-size:16px;font-weight:600}

.pair.manual{border:2px dashed var(--yellow-strong);padding:2px}
.pair.waiting{border:2px dotted var(--yellow-strong);padding:2px}
.pair.waiting .cell{opacity:.6}
.pair.flash{animation:flash .9s ease-out}
@keyframes flash{0%,25%{box-shadow:0 0 0 4px var(--ring)}100%{box-shadow:0 0 0 4px transparent}}

/* ---------- 선택창 ---------- */
dialog{width:min(380px, calc(100% - 32px));max-height:88%;overflow:auto;padding:22px;border:0;border-radius:22px;background:var(--sheet);color:var(--ink);box-shadow:0 0 0 1px var(--hair), 0 30px 70px -20px rgba(8,12,24,.5)}
dialog::backdrop{background:rgba(10,15,28,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 16px;font-size:19px;font-weight:700;text-align:center}
dialog p{margin:0 0 18px;color:var(--muted);text-align:center;line-height:1.6;word-break:keep-all}
.options{display:grid;gap:8px}
.options.lineSel{grid-template-columns:1fr 1fr;gap:10px}
.option{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:0 20px;border:1px solid transparent;border-radius:14px;background:var(--soft);color:var(--ink);font-size:19px;font-weight:700}
.option:hover{border-color:var(--blue)}
.option.cycle span{font-family:var(--num);font-size:26px}
.option small{font-size:14px;font-weight:500;opacity:.75}
.option.lineSel{justify-content:center;min-height:76px}
.option[aria-pressed="true"].cycle{background:var(--orange-bg);color:var(--orange-ink)}
.option[aria-pressed="true"].lineSel{background:var(--purple-bg);color:var(--purple-ink)}
.dialog-buttons{display:flex;gap:8px;margin-top:16px}
.dialog-buttons .btn{flex:1;min-height:48px;padding:0 6px}
textarea{display:block;width:100%;height:240px;resize:vertical;padding:14px;border:1px solid var(--hair);border-radius:14px;background:var(--soft);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom, 0px));width:max-content;max-width:calc(100% - 32px);padding:12px 20px;border-radius:999px;background:var(--toast-bg);color:var(--toast-ink);font-size:14px;font-weight:500;line-height:1.45;text-align:center;word-break:keep-all;z-index:20;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%, 8px)}}

/* ---------- 휴대폰 ---------- */
@media (max-width:599px){
  body{padding-block:10px}
  .sheet{border-radius:18px}
  .panel{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px}
  .settings{gap:9px 9px}
  .label{font-size:16px}
  .label.second{padding-left:0}
  .actions{padding:12px 0 0;border-left:0;border-top:1px solid var(--tool-line)}
  .tool{flex:1;flex-direction:row;height:42px;border-radius:var(--radius);font-size:15px}
  .tool svg{width:19px;height:19px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;padding:22px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));border-radius:24px 24px 0 0}
  dialog[open]{animation:sheet-up .24s cubic-bezier(.2,.8,.3,1)}
  @keyframes sheet-up{from{transform:translateY(40px);opacity:.4}}
}
@media (max-width:359px){
  .panel{padding:12px}
  .rows{padding-inline:10px}
  .row{column-gap:7px}
  .cell{font-size:22px}
  .num{font-size:20px}
  .btn{padding:0 8px}
  .pick{gap:6px;padding:0 4px}
  .pick.lineSel{font-size:16px}
  .status{min-height:60px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main class="sheet">
  <h1 class="sr">배출 시간 계산기</h1>

  <div class="panel">
    <div class="settings">
      <span class="label">배출</span>
      <div class="pair t-yellow head" id="d-pair">
        <input class="cell" id="d-h" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="next" placeholder="시" aria-label="배출 시간(시)">
        <span class="colon" aria-hidden="true"></span>
        <input class="cell" id="d-m" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="분" aria-label="배출 시간(분)">
      </div>
      <button type="button" class="btn apply" id="apply">설정</button>

      <span class="label">주기</span>
      <button type="button" class="pick cycle" id="cycle-btn" aria-haspopup="dialog">선택</button>
      <span class="label second">라인</span>
      <button type="button" class="pick lineSel" id="line-btn" aria-haspopup="dialog">선택</button>
    </div>
    <div class="actions">
      <button type="button" class="tool" id="share-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8 12 3.5 16.500 8M6 12H5v8h14v-8h-1"/></svg>
        <span>공유</span>
      </button>
      <button type="button" class="tool" id="reset-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.500 9.500a8 8 0 1 1-.3 4.500M4 4.500v5.200h5.200"/></svg>
        <span>초기화</span>
      </button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>
  <ol class="rows" id="rows"></ol>
</main>

<dialog id="pick-dialog" aria-labelledby="pick-title">
  <h2 id="pick-title"></h2>
  <div class="options" id="pick-options"></div>
  <div class="dialog-buttons"><button type="button" class="btn plain" data-close>닫기</button></div>
</dialog>

<dialog id="share-dialog" aria-labelledby="share-title">
  <h2 id="share-title">배출 시간 공유</h2>
  <textarea id="share-text" readonly aria-label="공유할 내용"></textarea>
  <div class="dialog-buttons">
    <button type="button" class="btn plain" data-close>닫기</button>
    <button type="button" class="btn" id="copy-btn">복사하기</button>
    <button type="button" class="btn" id="send-btn" hidden>보내기</button>
  </div>
</dialog>

<dialog id="reset-dialog" aria-labelledby="reset-title">
  <h2 id="reset-title">모두 지울까요?</h2>
  <p>배출, 주기, 라인, 시간표에 입력한 내용이 모두 지워집니다.</p>
  <div class="dialog-buttons">
    <button type="button" class="btn plain" data-close autofocus>취소</button>
    <button type="button" class="btn danger" id="reset-ok">모두 지우기</button>
  </div>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>

<script>
(function () {
  'use strict';

  var ROWS = 10;
  var CYCLE_ADD = { 16: 6, 18: 7, 20: 8, 22: 9, 24: 10 };   // 주기별로 더하는 분
  var LINES = ['A', 'B', 'C', 'D'];
  var KEY = 'discharge-time-calc-v1';
  var RANGE_MSG = '시는 00~23, 분은 00~59까지 입력해 주세요.';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 시간 계산 (모든 시간은 0시부터의 분으로 저장) ---------- */
  function wrap(min) { return ((min % 1440) + 1440) % 1440; }            // 24시간 표기: 24:00 → 00:00
  function pad(n, len) { return String(n).padStart(len || 2, '0'); }
  function fmt(min) { return min === null ? '--:--' : pad(Math.floor(min / 60)) + ':' + pad(min % 60); }

  function blank() {
    return {
      draft: null,                       // 배출 칸에 입력한 값
      discharge: null,                   // '설정'으로 적용한 배출 값
      cycle: null,
      line: null,
      green: new Array(ROWS).fill(''),
      start: null,                       // 회색 칸
      entered: new Array(ROWS).fill(null), // 둘째 줄부터 오른쪽 칸에 입력한 시간(배출 더하기 전)
      manual: new Array(ROWS).fill(null)   // 왼쪽 칸을 직접 고친 경우
    };
  }

  function calculate() {
    var D = state.discharge;
    var add = state.cycle === null ? null : CYCLE_ADD[state.cycle];
    var first = (state.start !== null && D !== null) ? wrap(state.start + D) : null;
    var out = [{ auto: state.start, left: state.start, right: first }];
    var prev = first;
    for (var i = 1; i < ROWS; i++) {
      var auto = (prev !== null && add !== null) ? wrap(prev + add) : null;  // 윗줄 결과 + 주기 분
      var m = state.manual[i];
      if (m && m.base !== auto) { state.manual[i] = m = null; }              // 위 값이 바뀌면 자동값 우선
      var right = (state.entered[i] !== null && D !== null) ? wrap(state.entered[i] + D) : null; // 입력 + 배출
      out.push({ auto: auto, left: m ? m.v : auto, right: right });
      prev = right;
    }
    return out;
  }

  /* ---------- 저장 / 불러오기 ---------- */
  function isTime(v) { return Number.isInteger(v) && v >= 0 && v < 1440; }
  function load() {
    var s = blank();
    try {
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (!raw) return s;
      ['draft', 'discharge', 'start'].forEach(function (k) { if (isTime(raw[k])) s[k] = raw[k]; });
      if (CYCLE_ADD[raw.cycle]) s.cycle = Number(raw.cycle);
      if (LINES.indexOf(raw.line) >= 0) s.line = raw.line;
      for (var i = 0; i < ROWS; i++) {
        if (raw.green && typeof raw.green[i] === 'string') s.green[i] = raw.green[i];
        if (raw.entered && isTime(raw.entered[i])) s.entered[i] = raw.entered[i];
        var m = raw.manual && raw.manual[i];
        if (m && isTime(m.v) && (m.base === null || isTime(m.base))) s.manual[i] = { v: m.v, base: m.base };
      }
    } catch (e) { /* 저장 공간을 쓸 수 없으면 빈 화면으로 시작 */ }
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var state = load();
  var pairs = [];
  var greens = [];

  /* ---------- 알림 ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* 계산 값이 바뀐 칸을 잠깐 강조 */
  function flash(el) {
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  /* ---------- 공통: 누르면 내용 전체 선택 ---------- */
  function selectOnFocus(el) {
    var typed = false;
    el.addEventListener('focus', function () {
      typed = false;
      el.select();
      setTimeout(function () {
        if (!typed && document.activeElement === el) el.setSelectionRange(0, el.value.length);
      }, 0);
    });
    el.addEventListener('input', function () { typed = true; });
    el.addEventListener('mouseup', function (e) { e.preventDefault(); });
  }

  /* ---------- 시:분 한 쌍 ---------- */
  function timePair(box, hEl, mEl, opt) {
    var editing = false, before = '', shown;
    function show(v) {
      hEl.value = v === null ? '' : pad(Math.floor(v / 60));
      mEl.value = v === null ? '' : pad(v % 60);
    }
    box.addEventListener('focusin', function () {
      if (editing) return;
      editing = true;
      var target = document.activeElement;
      show(opt.editValue());
      before = hEl.value + ':' + mEl.value;
      if (target === hEl || target === mEl) target.select();
      if (opt.onEdit) opt.onEdit();
    });
    box.addEventListener('focusout', function (e) {
      if (box.contains(e.relatedTarget)) return;
      editing = false;
      var h = hEl.value, m = mEl.value;
      if (h + ':' + m === before) { render(); return; }          // 바꾸지 않았으면 그대로 (두 번 더해지지 않음)
      if (h === '' && m === '') { opt.commit(null); update(); return; }
      var hh = Number(h), mm = Number(m);
      if (hh > 23 || mm > 59) { toast(RANGE_MSG); render(); return; }
      opt.commit(hh * 60 + mm); update();
    });
    [hEl, mEl].forEach(function (el) {
      selectOnFocus(el);
      el.addEventListener('input', function (e) {
        var v = el.value.replace(/\D/g, '');
        if (v.length > 2) v = (e.data || '').replace(/\D/g, '').slice(-2) || v.slice(0, 2);
        el.value = v;
        if (v.length < 2) return;
        if (Number(v) > (el === hEl ? 23 : 59)) { toast(RANGE_MSG); el.select(); return; }
        if (el === hEl) mEl.focus(); else el.blur();             // 두 자리를 넣으면 자동으로 다음 칸
      });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (el === hEl) { mEl.focus(); return; }
          el.blur();
          if (opt.onEnter) opt.onEnter();
        } else if (e.key === 'Escape') {
          var parts = before.split(':'); hEl.value = parts[0]; mEl.value = parts[1]; el.blur();
        }
      });
    });
    pairs.push({
      paint: function (calc) {
        if (editing) return;
        var view = opt.view(calc);
        show(view.value);
        box.classList.toggle('manual', !!view.manual);
        box.classList.toggle('waiting', !!view.waiting);
        if (opt.computed && shown !== undefined && view.value !== null && view.value !== shown) flash(box);
        shown = view.value;
      }
    });
  }

  /* ---------- 시간표 만들기 ---------- */
  function timeInput(id, label, ph) {
    return '<input class="cell" id="' + id + '" type="text" inputmode="numeric" autocomplete="off" aria-label="' + label + '" placeholder="' + ph + '">';
  }
  var COLON = '<span class="colon" aria-hidden="true"></span>';
  var html = '';
  for (var i = 0; i < ROWS; i++) {
    var n = (i + 1) + '번째 줄 ';
    html += '<li class="row">' +
      '<input class="num" id="g-' + i + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="12" aria-label="' + n + '번호"' + (i === 0 ? ' placeholder="번호"' : '') + '>';
    if (i === 0) {
      html += '<div class="pair t-gray" id="start-pair">' + timeInput('start-h', n + '시작 시', '시') + COLON + timeInput('start-m', n + '시작 분', '분') + '</div>' +
        '<div class="pair t-red" id="result-pair"><output class="cell" id="result-h" aria-label="' + n + '계산 결과 시"></output>' + COLON +
        '<output class="cell" id="result-m" aria-label="' + n + '계산 결과 분"></output></div>';
    } else {
      html += '<div class="pair t-yellow" id="l-' + i + '">' + timeInput('l-' + i + '-h', n + '왼쪽 시', '––') + COLON + timeInput('l-' + i + '-m', n + '왼쪽 분', '––') + '</div>' +
        '<div class="pair t-yellow" id="r-' + i + '">' + timeInput('r-' + i + '-h', n + '오른쪽 시', '––') + COLON + timeInput('r-' + i + '-m', n + '오른쪽 분', '––') + '</div>';
    }
    html += '</li>';
  }
  $('rows').innerHTML = html;

  /* 배출 칸 */
  timePair($('d-pair'), $('d-h'), $('d-m'), {
    editValue: function () { return state.draft; },
    view: function () { return { value: state.draft }; },
    commit: function (v) { state.draft = v; },
    onEnter: applyDischarge
  });
  /* 회색 칸 */
  timePair($('start-pair'), $('start-h'), $('start-m'), {
    editValue: function () { return state.start; },
    view: function () { return { value: state.start }; },
    commit: function (v) { state.start = v; }
  });
  /* 둘째 줄부터 */
  for (var r = 1; r < ROWS; r++) (function (i) {
    timePair($('l-' + i), $('l-' + i + '-h'), $('l-' + i + '-m'), {
      computed: true,
      editValue: function () { return calculate()[i].left; },
      view: function (c) { return { value: c[i].left, manual: !!state.manual[i] }; },
      commit: function (v) {
        var auto = calculate()[i].auto;
        state.manual[i] = (v === null || v === auto) ? null : { v: v, base: auto };
      }
    });
    timePair($('r-' + i), $('r-' + i + '-h'), $('r-' + i + '-m'), {
      computed: true,
      editValue: function () { return state.entered[i]; },       // 고칠 때는 처음 입력한 시간을 보여 줌
      view: function (c) {
        var waiting = state.discharge === null && state.entered[i] !== null;
        return { value: waiting ? state.entered[i] : c[i].right, waiting: waiting };
      },
      commit: function (v) { state.entered[i] = v; },
      onEdit: function () {
        if (state.entered[i] !== null && state.discharge !== null) {
          $('status').textContent = '수정 중: 처음 입력한 시간이 보여요';
          $('status').dataset.tone = 'edit';
        }
      }
    });
  })(r);

  /* ---------- 초록 칸 ---------- */
  for (var g = 0; g < ROWS; g++) (function (i) {
    var el = $('g-' + i), dirty = false;
    greens.push(el);
    selectOnFocus(el);
    el.addEventListener('input', function () { dirty = true; });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.blur(); }
    });
    el.addEventListener('blur', function () {
      if (!dirty) return;
      dirty = false;
      var v = el.value.trim();
      var isNumber = /^\d{1,3}$/.test(v);
      state.green[i] = isNumber ? pad(Number(v), 3) : v;       // 숫자는 세 자리, 글자는 그대로
      if (i === 0 && isNumber) {                               // 맨 위 숫자 → 아래로 +1
        for (var k = 1; k < ROWS; k++) state.green[k] = pad((Number(v) + k) % 1000, 3);
      } else if (i === 0 && /^\d{4,}$/.test(v)) {
        toast('자동 번호는 세 자리(000~999)까지 됩니다.');
      }
      update();
    });
  })(g);

  /* ---------- 화면 그리기 ---------- */
  function statusText() {
    if (state.draft !== state.discharge) return state.draft === null
      ? '설정을 누르면 배출 시간이 지워져요.'
      : '설정을 누르면 적용돼요 (배출 ' + fmt(state.draft) + ')';
    if (state.discharge === null) return '배출 시간을 입력하고 설정을 눌러 주세요.';
    if (state.cycle === null) return '주기를 선택해 주세요.';
    if (state.start === null) return '회색 칸에 시간과 분을 입력해 주세요.';
    return '배출 ' + fmt(state.discharge) + ' 적용 중, 다음 줄 +' + CYCLE_ADD[state.cycle] + '분';
  }
  var shownResult;
  function render() {
    var c = calculate();
    pairs.forEach(function (p) { p.paint(c); });
    var res = c[0].right;
    $('result-h').textContent = res === null ? '' : pad(Math.floor(res / 60));
    $('result-m').textContent = res === null ? '' : pad(res % 60);
    if (shownResult !== undefined && res !== null && res !== shownResult) flash($('result-pair'));
    shownResult = res;
    greens.forEach(function (el, i) {
      if (el !== document.activeElement) el.value = state.green[i];
      el.classList.toggle('text', state.green[i] !== '' && !/^\d{1,3}$/.test(state.green[i]));  // 글자는 작게 보여 잘리지 않게
    });
    $('cycle-btn').textContent = state.cycle === null ? '선택' : state.cycle;
    $('cycle-btn').classList.toggle('empty', state.cycle === null);
    $('cycle-btn').setAttribute('aria-label', '주기 ' + (state.cycle === null ? '선택' : state.cycle));
    $('line-btn').textContent = state.line === null ? '선택' : state.line + '라인';
    $('apply').classList.toggle('pending', state.draft !== state.discharge);
    $('status').textContent = statusText();
    var ready = state.draft === state.discharge && state.discharge !== null && state.cycle !== null && state.start !== null;
    $('status').dataset.tone = ready ? 'ok' : 'todo';
  }
  function update() { calculate(); save(); render(); }

  /* ---------- 버튼 ---------- */
  function commitFocused() {
    var a = document.activeElement;
    if (a && a.tagName === 'INPUT') a.blur();
  }
  function applyDischarge() {
    commitFocused();
    if (state.draft === null && state.discharge === null) { toast('배출 시간을 먼저 입력해 주세요.'); return; }
    state.discharge = state.draft;
    update();
    toast(state.discharge === null ? '배출 시간을 지웠어요.' : '배출 ' + fmt(state.discharge) + ' 설정 완료');
  }
  $('apply').addEventListener('click', applyDischarge);

  function openPicker(title, kind, items, current, choose) {
    commitFocused();
    $('pick-title').textContent = title;
    var box = $('pick-options');
    box.textContent = '';
    box.className = 'options ' + kind;
    var selected = null;
    items.forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'option ' + kind;
      b.setAttribute('aria-pressed', String(item.value === current));
      var name = document.createElement('span'); name.textContent = item.label; b.appendChild(name);
      if (item.note) { var s = document.createElement('small'); s.textContent = item.note; b.appendChild(s); }
      b.addEventListener('click', function () { choose(item.value); $('pick-dialog').close(); update(); });
      if (item.value === current) selected = b;
      box.appendChild(b);
    });
    $('pick-dialog').showModal();
    (selected || box.firstChild).focus();
  }
  $('cycle-btn').addEventListener('click', function () {
    openPicker('주기 선택', 'cycle', Object.keys(CYCLE_ADD).map(function (k) {
      return { value: Number(k), label: k, note: '+' + CYCLE_ADD[k] + '분' };
    }), state.cycle, function (v) { state.cycle = v; });
  });
  $('line-btn').addEventListener('click', function () {
    openPicker('라인 선택', 'lineSel', LINES.map(function (l) {
      return { value: l, label: l + '라인' };
    }), state.line, function (v) { state.line = v; });
  });

  function shareText() {
    var c = calculate();
    var lines = [
      (state.line ? state.line + '라인' : '라인 미선택') + ' 배출 시간'
    ];
    var count = 0;
    for (var i = 0; i < ROWS; i++) {
      if (c[i].left === null && c[i].right === null) continue;
      lines.push((state.green[i] || '-') + '   ' + fmt(c[i].left) + ' → ' + fmt(c[i].right));
      count++;
    }
    if (!count) lines.push('입력된 시간이 없습니다.');
    return lines.join('\n');
  }
  $('share-btn').addEventListener('click', function () {
    commitFocused();
    $('share-text').value = shareText();
    $('send-btn').hidden = !navigator.share;
    $('share-dialog').showModal();
    $('copy-btn').focus();
    $('share-text').scrollTop = 0;
  });
  $('copy-btn').addEventListener('click', function () {
    var area = $('share-text');
    function fallback() {
      area.focus(); area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      alertInDialog(ok ? '복사했어요' : '글을 직접 복사해 주세요');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(area.value).then(function () { alertInDialog('복사했어요'); }, fallback);
    } else fallback();
  });
  var copyTimer;
  function alertInDialog(msg) {                    // 선택창 위에서는 버튼 글자로 알려 줌
    var b = $('copy-btn');
    b.textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { b.textContent = '복사하기'; }, 2200);
  }
  $('send-btn').addEventListener('click', function () {
    navigator.share({ title: '시간표', text: $('share-text').value }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      $('send-btn').hidden = true;
      alertInDialog('복사해서 보내 주세요');
    });
  });

  $('reset-btn').addEventListener('click', function () { commitFocused(); $('reset-dialog').showModal(); });
  $('reset-ok').addEventListener('click', function () {
    state = blank();
    $('reset-dialog').close();
    update();
    toast('모두 지웠어요.');
  });

  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-close')) { d.close(); return; }
      if (e.target !== d) return;
      var b = d.getBoundingClientRect();           // 창 바깥을 누르면 닫기
      if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) d.close();
    });
  });

  render();
})();
</script>
</body>
</html>
